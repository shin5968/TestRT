name: build-windows

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Cache llvm-mingw
        uses: actions/cache@v4
        with:
          path: C:\llvm-mingw
          key: llvm-mingw-20251216-ucrt-x86_64

      - name: Set up llvm-mingw (UCRT, x86_64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "20251216"
          $root = "C:\llvm-mingw\llvm-mingw-$ver-ucrt-x86_64"
          $clang = Join-Path $root "bin\x86_64-w64-mingw32-clang++.exe"
          if (-not (Test-Path $clang)) {
            $zip = "llvm-mingw-$ver-ucrt-x86_64.zip"
            $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/$zip"
            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath C:\llvm-mingw -Force
          }
          $bin = Join-Path $root "bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $clang --version

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G Ninja --toolchain "cmake/mingw-llvm.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Verify PE32+ x86-64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "build\rtprobe.exe"
          if (-not (Test-Path $exe)) { throw "rtprobe.exe not found" }
          $item = Get-Item $exe
          Write-Host "artifact size: $($item.Length) bytes"
          $magic = [System.IO.File]::ReadAllBytes($exe)[0..1]
          if ($magic[0] -ne 0x4D -or $magic[1] -ne 0x5A) { throw "not a PE file" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtprobe-windows-x64
          path: build/rtprobe.exe
          if-no-files-found: error
          retention-days: 30
